server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver — uncomment and set for your environment
    # For Kubernetes: resolver kube-dns.kube-system.svc.cluster.local valid=30s;
    # For Docker:     resolver 127.0.0.11 valid=30s;
    # For bare metal: resolver 8.8.8.8 valid=30s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text-javascript application/x-javascript application/xml application/javascript application/json application/octet-stream application/wasm model/stl model/obj;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # COOP/COEP headers required for SharedArrayBuffer (WASM threading)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Content Security Policy — adjust connect-src for your backend URLs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://login.microsoftonline.com https://*.microsoftonline.com https://graph.microsoft.com http://localhost:*; frame-ancestors 'self'; worker-src 'self' blob:;" always;

    # Large WASM files + CAD file uploads
    client_max_body_size 500M;

    # Backend API proxies — configure these for your deployment
    # Use variables so nginx doesn't crash if backends are unavailable

    location /api/cad/ {
        # set $cad_upstream http://cad-service:8090;
        # proxy_pass $cad_upstream/api/cad/;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_read_timeout 300s;
        return 503 '{"error": "CAD service not configured"}';
        add_header Content-Type application/json;
    }

    location /api/file-proxy/ {
        # set $file_upstream http://file-proxy:8000;
        # proxy_pass $file_upstream/api/file-proxy/;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # client_max_body_size 500M;
        return 503 '{"error": "File proxy not configured"}';
        add_header Content-Type application/json;
    }

    location /api/llm-gateway/ {
        # set $llm_upstream http://llm-gateway:8080;
        # proxy_pass $llm_upstream/api/llm-gateway/;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_read_timeout 120s;
        return 503 '{"error": "LLM gateway not configured"}';
        add_header Content-Type application/json;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache WASM files
    location ~* \.wasm$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/wasm";
    }

    # Don't cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Metrics endpoint (for Prometheus) — restrict to your network
    location /metrics {
        stub_status on;
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
